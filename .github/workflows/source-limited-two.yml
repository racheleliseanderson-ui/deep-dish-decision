name: Source-limited two-record hygiene

on:
  pull_request:
    branches:
      - data/hygiene-source-repairs-4
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  mark-source-limited:
    if: github.head_ref == 'data/hygiene-source-limited-2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data/hygiene-source-limited-2
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

      - name: Validate corpus before mutation
        run: npm run validate:seed

      - name: Mark exact source-limited records
        run: node scripts/pipeline/mark-source-limited.mjs

      - name: Validate corpus after mutation
        run: npm run validate:seed

      - name: Recompute refresh and coverage
        run: |
          node scripts/pipeline/refresh.mjs
          node scripts/pipeline/report.mjs

      - name: Write source-limited QA
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p, fallback = {}) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return fallback; }
          };
          const result = read('src/data/source-limited-result.json');
          const coverage = read('src/data/coverage.json', { totals: {} });
          const refresh = read('src/data/refresh-queue.json', { totals: {} });
          const qa = {
            generatedAt: new Date().toISOString(),
            branch: 'data/hygiene-source-limited-2',
            sourceCommit: process.env.GITHUB_SHA,
            passed: true,
            sourceLimited: {
              total: result.total ?? null,
              marked: result.sourceLimited ?? null,
              missing: result.missing ?? null,
              slugs: (result.records ?? []).filter((r) => r.status === 'source-limited').map((r) => r.slug),
            },
            coverageTotals: coverage.totals ?? {},
            refreshTotals: refresh.totals ?? {},
          };
          fs.writeFileSync('src/data/source-limited-qa.json', JSON.stringify(qa, null, 2) + '\n');
          NODE

      - name: Commit generated source-limited artifacts
        shell: bash
        run: |
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/dataset.json src/data/enrichment.json src/data/coverage.json \
            src/data/refresh-queue.json src/data/run-log.json \
            src/data/source-limited-result.json src/data/source-limited-qa.json
          if git diff --staged --quiet; then
            echo "No source-limited changes to commit"
          else
            git commit -m "chore(corpus): mark two operator-platform sources limited"
            git push origin HEAD:data/hygiene-source-limited-2
          fi
