name: Stacked corpus execution QA

on:
  push:
    branches:
      - data/hygiene-owned-match-status
    paths:
      - .github/workflows/qa-stack-execute.yml

permissions:
  contents: write

jobs:
  validate-and-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RI_PLAYWRIGHT: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data/hygiene-owned-match-status
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          npm install --no-package-lock
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run tests
        id: tests
        if: steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm test
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Typecheck
        id: typecheck
        if: steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run typecheck
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate seed corpus
        id: seedvalidate
        if: steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run validate:seed
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seed and enrich all pending staged records
        id: pipeline
        if: steps.install.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.typecheck.outputs.exit_code == '0' && steps.seedvalidate.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node scripts/pipeline/seed-and-enrich.mjs
          code=$?
          if [ "$code" -eq 0 ]; then
            node scripts/pipeline/refresh.mjs
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/pipeline/report.mjs
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write QA result
        if: always()
        env:
          INSTALL_EXIT: ${{ steps.install.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          SEED_VALIDATE_EXIT: ${{ steps.seedvalidate.outputs.exit_code }}
          PIPELINE_EXIT: ${{ steps.pipeline.outputs.exit_code }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p, fallback = {}) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return fallback; }
          };
          const num = (v) => v === undefined || v === '' ? null : Number(v);
          const dataset = read('src/data/dataset.json', { records: [] });
          const enrichment = read('src/data/enrichment.json', { records: {} });
          const coverage = read('src/data/coverage.json', { totals: {} });
          const refresh = read('src/data/refresh-queue.json', { totals: {} });
          const expansion = read('src/data/expansion-queue.json', { cities: [] });
          const result = {
            generatedAt: new Date().toISOString(),
            branch: process.env.GITHUB_REF_NAME,
            commit: process.env.GITHUB_SHA,
            checks: {
              install: num(process.env.INSTALL_EXIT),
              tests: num(process.env.TEST_EXIT),
              typecheck: num(process.env.TYPECHECK_EXIT),
              validateSeed: num(process.env.SEED_VALIDATE_EXIT),
              pipeline: num(process.env.PIPELINE_EXIT),
            },
            passed: [process.env.INSTALL_EXIT, process.env.TEST_EXIT, process.env.TYPECHECK_EXIT, process.env.SEED_VALIDATE_EXIT, process.env.PIPELINE_EXIT].every((v) => v === '0'),
            corpus: {
              datasetRecords: dataset.records?.length ?? dataset.count ?? null,
              enrichmentRecords: Object.keys(enrichment.records ?? {}).length,
              coverageTotals: coverage.totals ?? {},
              refreshTotals: refresh.totals ?? {},
              expansionPending: (expansion.cities ?? []).filter((c) => c.status !== 'done').map((c) => ({ city: c.city, stateCode: c.stateCode, priority: c.priority })),
            },
          };
          fs.writeFileSync('src/data/qa-stack-result.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Commit generated corpus and QA result
        if: always()
        shell: bash
        run: |
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/dataset.json src/data/enrichment.json src/data/coverage.json src/data/refresh-queue.json \
            src/data/expansion-queue.json src/data/run-log.json src/data/qa-stack-result.json || true
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore(corpus): execute stacked QA and recompute corpus"
            git push origin HEAD:data/hygiene-owned-match-status
          fi
