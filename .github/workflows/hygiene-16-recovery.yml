name: Targeted first-party hygiene recovery

on:
  pull_request:
    branches:
      - data/hygiene-owned-match-status
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  recover-first-party-failures:
    if: github.head_ref == 'data/hygiene-first-party-failures-16' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RI_PLAYWRIGHT: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data/hygiene-first-party-failures-16
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium for targeted browser recovery
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Validate corpus before recovery
        run: npm run validate:seed

      - name: Recover exact failed first-party sites
        run: node scripts/pipeline/recover-owned-sites.mjs

      - name: Validate corpus after source corrections
        run: npm run validate:seed

      - name: Recompute refresh queue and coverage
        run: |
          node scripts/pipeline/refresh.mjs
          node scripts/pipeline/report.mjs

      - name: Write recovery QA summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p, fallback = {}) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return fallback; }
          };
          const recovery = read('src/data/hygiene-recovery-result.json');
          const coverage = read('src/data/coverage.json', { totals: {} });
          const refresh = read('src/data/refresh-queue.json', { totals: {} });
          const result = {
            generatedAt: new Date().toISOString(),
            branch: 'data/hygiene-first-party-failures-16',
            sourceCommit: process.env.GITHUB_SHA,
            passed: true,
            recovery: {
              total: recovery.total ?? null,
              resolved: recovery.resolved ?? null,
              failures: recovery.failures ?? null,
              missing: recovery.missing ?? null,
              datasetSourceCorrections: recovery.datasetSourceCorrections ?? null,
              unresolvedSlugs: (recovery.records ?? []).filter((r) => r.matchStatus !== 'resolved').map((r) => r.slug),
            },
            coverageTotals: coverage.totals ?? {},
            refreshTotals: refresh.totals ?? {},
          };
          fs.writeFileSync('src/data/hygiene-recovery-qa.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Commit recovery artifacts
        shell: bash
        run: |
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/dataset.json src/data/enrichment.json src/data/coverage.json \
            src/data/refresh-queue.json src/data/run-log.json \
            src/data/hygiene-recovery-result.json src/data/hygiene-recovery-qa.json
          if git diff --staged --quiet; then
            echo "No recovery changes to commit"
          else
            git commit -m "chore(corpus): execute 16-site hygiene recovery"
            git push origin HEAD:data/hygiene-first-party-failures-16
          fi
