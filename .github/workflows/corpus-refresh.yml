name: Corpus refresh hygiene

# Scheduled hygiene uses owned-site first-party reads. The seed-listings mode is
# keyless and uses verified repository seed files followed by owned-site
# enrichment. Google Places discovery was removed from this project and
# scripts/pipeline/discover.mjs is a stub that exits 1, so the modes that
# dispatched it are gone; the guard below says so instead of failing silently
# three steps in.

on:
  schedule:
    # Tuesdays and Fridays 14:00 UTC — adjust once secrets are live
    - cron: "0 14 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "hygiene | seed-listings"
        required: true
        default: "hygiene"
      batch:
        description: "Hygiene batch size"
        required: false
        default: "25"
      seed_cities:
        description: "Optional comma-separated city names for seed-listings mode"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Rebuild refresh queue + coverage
        run: |
          node scripts/pipeline/refresh.mjs
          node scripts/pipeline/report.mjs

      - name: Reject retired discovery modes
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'discover' || inputs.mode == 'seed') }}
        run: |
          echo "::error::mode=${{ inputs.mode }} is retired. discover.mjs was disabled when Google Places was removed. Use mode=seed-listings for offline verified seeding plus owned-site enrichment, or mode=hygiene."
          exit 1

      # Hygiene first on schedule and in hygiene mode.
      - name: Hygiene enrich
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'hygiene' }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/pipeline/enrich.mjs --hygiene --batch=${{ inputs.batch || 25 }}

      - name: Seed verified listings + owned enrichment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'seed-listings' }}
        run: |
          SEED_CITIES="${{ inputs.seed_cities }}"
          if [ -n "$SEED_CITIES" ]; then
            node scripts/pipeline/seed-and-enrich.mjs --cities="$SEED_CITIES"
          else
            node scripts/pipeline/seed-and-enrich.mjs
          fi

      - name: Recompute coverage
        run: node scripts/pipeline/report.mjs

      - name: Commit corpus updates
        run: |
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/enrichment.json src/data/dataset.json src/data/refresh-queue.json \
            src/data/coverage.json src/data/run-log.json src/data/expansion-queue.json || true
          if git diff --staged --quiet; then
            echo "No corpus changes"
          else
            MODE="${{ inputs.mode || 'hygiene' }}"
            git commit -m "chore(corpus): ${MODE} pass — seed / refresh locations"
            git push
          fi
