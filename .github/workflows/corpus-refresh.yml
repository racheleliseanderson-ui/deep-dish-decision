name: Corpus refresh hygiene

# Scheduled hygiene uses owned-site first-party reads. Discovery modes may still
# require configured provider keys. The seed-listings mode is keyless and uses
# verified repository seed files followed by owned-site enrichment.

on:
  push:
    branches:
      - data/enrich-top50-43-48
    paths:
      - .github/workflows/corpus-refresh.yml
  schedule:
    # Tuesdays and Fridays 14:00 UTC — adjust once secrets are live
    - cron: "0 14 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "hygiene | discover | seed | seed-listings"
        required: true
        default: "hygiene"
      batch:
        description: "Hygiene batch size / restaurants per city on discover"
        required: false
        default: "25"
      cities:
        description: "Cities per discover run (discover/seed modes)"
        required: false
        default: "3"
      seed_cities:
        description: "Optional comma-separated city names for seed-listings mode"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Rebuild refresh queue + coverage
        run: |
          node scripts/pipeline/refresh.mjs
          node scripts/pipeline/report.mjs

      # Hygiene first on schedule, hygiene mode, and legacy seed/discover mode.
      - name: Hygiene enrich
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'hygiene' || inputs.mode == 'seed' }}
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/pipeline/enrich.mjs --hygiene --batch=${{ inputs.batch || 25 }}

      # Pure discover still allowed, but must clear hygiene gate or allow-with-hygiene.
      - name: Controlled discover
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'discover' || inputs.mode == 'seed') }}
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          CITIES="${{ inputs.cities || 3 }}"
          LIMIT="${{ inputs.batch || 25 }}"
          # discover.mjs uses --cities and --limit (not --batch).
          # After seed-mode hygiene, allow-with-hygiene still guards residual due items.
          node scripts/pipeline/discover.mjs \
            --cities="$CITIES" \
            --limit="$LIMIT" \
            --allow-with-hygiene

      - name: Seed verified listings + owned enrichment
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'seed-listings') }}
        run: |
          SEED_CITIES="${{ inputs.seed_cities }}"
          if [ -n "$SEED_CITIES" ]; then
            node scripts/pipeline/seed-and-enrich.mjs --cities="$SEED_CITIES"
          else
            node scripts/pipeline/seed-and-enrich.mjs
          fi

      - name: Recompute coverage
        run: node scripts/pipeline/report.mjs

      - name: Commit corpus updates
        run: |
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/enrichment.json src/data/dataset.json src/data/refresh-queue.json \
            src/data/coverage.json src/data/run-log.json src/data/expansion-queue.json || true
          if git diff --staged --quiet; then
            echo "No corpus changes"
          else
            MODE="${{ inputs.mode || 'hygiene' }}"
            git commit -m "chore(corpus): ${MODE} pass — seed / refresh locations"
            git push
          fi
